[package]
name = "app"
version = "0.1.0"
description = "ComiFlow — comic & manga reader"
authors = ["KyLaEga"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Comic archive parsing
zip = "2.4"
base64 = "0.22"
# Cross-platform move-to-trash (recycle bin) for safe file deletion
trash = "5"
# Async oneshot channel for the non-blocking folder picker
tokio = { version = "1", features = ["sync"] }
