name: Build Android APK (Tauri)

# Только ручной запуск. core_base подключён через path-зависимость к
# приватному репозиторию rust-workspace, поэтому автоматическая сборка на CI
# требует CORE_BASE_PAT (fine-grained PAT с read-доступом). Пока PAT не задан,
# собирайте Android локально (см. README / setup-android-plugin.sh).
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # core_base подключён через path-зависимость (../../Rust_Workspace/core_base
      # от src-tauri/). На CI этой папки нет — клонируем rust-workspace репо рядом,
      # воссоздавая структуру локальной машины. Требует CORE_BASE_PAT в secrets
      # (fine-grained PAT с read на KyLaEga/rust-workspace).
      - name: Checkout shared core_base (Rust_Workspace)
        uses: actions/checkout@v4
        with:
          repository: KyLaEga/rust-workspace
          token: ${{ secrets.CORE_BASE_PAT }}
          path: ../Rust_Workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Tauri Android project
        # Uses the @tauri-apps/cli pinned in package.json (npm ci).
        run: npx tauri android init

      - name: Install ComiFlow SAF bridge plugin into gen/
        # gen/ is regenerated by `tauri android init` and gitignored, so the
        # Kotlin plugin (kept in src-tauri/mobile/android/) must be copied in.
        run: bash src-tauri/setup-android-plugin.sh

      - name: Build APK (Release, unsigned)
        # Release signing keys are not in the repo (see PR #1), so this produces
        # an unsigned APK suitable for sideloading / testing.
        run: npx tauri android build --apk

      - name: Locate built APK
        id: apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Calculate Semantic Version
        id: version
        run: |
          OFFSET=$(( ${{ github.run_number }} - 24 ))
          if [ $OFFSET -lt 0 ]; then OFFSET=0; fi
          MINOR=$(( OFFSET / 10 ))
          PATCH=$(( OFFSET % 10 ))
          echo "version=1.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: comiflow-android-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('android-v{0}', steps.version.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Android {0}', steps.version.outputs.version) }}
          body: |
            Автоматическая сборка Android APK (Tauri), версия ${{ steps.version.outputs.version }}.

            **Последний коммит:** `${{ github.event.head_commit.message }}`
            **Хэш:** `${{ github.sha }}`

            APK не подписан релизным ключом (ключи убраны из репозитория).
            Для установки включите «установка из неизвестных источников».
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
