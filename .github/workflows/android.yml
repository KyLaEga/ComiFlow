name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload releases

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync

      - name: Cache Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Calculate Semantic Version
        id: version
        run: |
          OFFSET=$(( ${{ github.run_number }} - 24 ))
          if [ $OFFSET -lt 0 ]; then OFFSET=0; fi
          MINOR=$(( OFFSET / 10 ))
          PATCH=$(( OFFSET % 10 ))
          echo "version=1.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Rename APK for Release
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ComiFlow-v${{ steps.version.outputs.version }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComiFlow-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/ComiFlow-v${{ steps.version.outputs.version }}.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Версия {0}', steps.version.outputs.version) }}
          body: |
            Автоматическая сборка приложения ComiFlow (Версия ${{ steps.version.outputs.version }}).
            
            **Последний коммит:** `${{ github.event.head_commit.message }}`
            **Хэш коммита:** `${{ github.sha }}`
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/ComiFlow-v${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
